<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>AI Chat</title>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-black">
	<main class="max-w-2xl mx-auto my-10 px-4">
		<h1 class="text-2xl font-bold mb-6 text-center">🧠 AI Chat</h1>

		<!-- 카드형 채팅 영역 -->
		<div class="border rounded-2xl bg-white shadow-sm flex flex-col h-[600px]">
			<div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
			<div class="border-t p-3 flex gap-2">
				<input type="text" id="message-input"
					class="flex-1 border border-gray-300 rounded-md px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-black"
					placeholder="메시지를 입력하세요..."
				/>
				<button id="send-button" class="bg-black hover:bg-gray-800 text-white px-5 font-semibold text-sm rounded-md">전송</button>
			</div>
		</div>
	</main>

	<script>
    function addMessage(content, sender) {
      const isUser = sender === 'user';
      const bubbleClass = isUser
        ? 'bg-gray-900 text-white rounded-xl rounded-tr-sm ml-auto'
        : 'bg-gray-200 text-black rounded-xl rounded-tl-sm mr-auto';

      const html = `
        <div class="flex ${isUser ? 'justify-end' : 'justify-start'}">
          <div class="px-4 py-2 max-w-[70%] text-sm ${bubbleClass}">
            ${content}
          </div>
        </div>
      `;
      $('#chat-box').append(html);
      $('#chat-box').scrollTop($('#chat-box')[0].scrollHeight);
    }

    function sendMessage() {
      const message = $('#message-input').val().trim();
      if (!message) return;

      addMessage(message, 'user');
      $('#message-input').val('');

      $.ajax({
        type: 'POST',
        url: '/chat',
        contentType: 'application/json',
        data: JSON.stringify({ userMsg: message }),
        success: function (response) {
          addMessage(response, 'bot');
        },
        error: function (xhr) {
          if (xhr.status === 429 || xhr.responseText.includes('rate limit')) {
            addMessage('🚫 너무 빠르게 요청했어. 잠시 후 다시 시도해줘!', 'bot');
          } else {
            addMessage('❌ 서버 오류가 발생했어.', 'bot');
          }
        }
      });
    }

    $('#send-button').on('click', sendMessage);
    $('#message-input').on('keydown', function (e) {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
